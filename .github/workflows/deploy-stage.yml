name: Deploy Stage
on:
  push:
    branches: [ "stage" ]

jobs:
  # 1) Build del código (npm ci/build) y empaquetado
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build Code
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-app-artifact
          path: .
          retention-days: 1

  # 2) Deploy: OIDC + Cloud Build (async, sin streaming) + Cloud Run
  deploy:
    needs: build-code
    environment: stage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-app-artifact
          path: .

      - name: Auth to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          access_token_lifetime: 1800s

      - name: Set GCP Project & Region Config
        run: |
          gcloud config set project ${{ vars.PROJECT_ID }}
          gcloud config set run/region ${{ vars.REGION }}

      - name: Build & Push Docker Image (VPC-SC safe)
        id: build_id
        run: |
          set -euo pipefail
          IMAGE_URL="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.SERVICE_NAME }}-repo/${{ vars.SERVICE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URL=$IMAGE_URL"

          # Lanza Cloud Build SIN streaming (solo async) y guarda el nombre
          BUILD_NAME="$(gcloud builds submit . --tag "$IMAGE_URL" --async --format='value(name)')"
          echo "⏳ Cloud Build Name: $BUILD_NAME"

          # Exporta outputs
          {
            echo "IMAGE_URL=$IMAGE_URL"
            echo "BUILD_NAME=$BUILD_NAME"
          } >> "$GITHUB_OUTPUT"

          # Poll hasta completar (máx ~10 min)
          for i in {1..120}; do
            STATUS="$(gcloud builds describe "$BUILD_NAME" --format='value(status)')"
            echo "⏳ Cloud Build status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build OK"
              exit 0
            fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "TIMEOUT" ]; then
              echo "❌ Cloud Build terminó en estado: $STATUS"
              exit 1
            fi
            sleep 5
          done
          echo "❌ Timeout esperando Cloud Build (~10 min)"; exit 1

      # (Opcional) Si falla el build, imprime failureInfo y últimos logs de Cloud Logging
      - name: Dump Cloud Build failure context
        if: failure() && steps.build_id.outputs.BUILD_NAME != ''
        run: |
          set -euo pipefail
          BUILD_NAME="${{ steps.build_id.outputs.BUILD_NAME }}"
          PROJECT_ID="${{ vars.PROJECT_ID }}"

          echo "🔎 Build describe (failureInfo):"
          gcloud builds describe "$BUILD_NAME" \
            --project "$PROJECT_ID" \
            --format='yaml(failureInfo,images,logsBucket,source)'

          echo "🧾 Últimos logs desde Cloud Logging:"
          ID_ONLY="${BUILD_NAME##*/}"
          gcloud logging read \
            'resource.type="build" AND resource.labels.build_id="'$ID_ONLY'"' \
            --project "$PROJECT_ID" \
            --limit 200 \
            --format='value(textPayload)'

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_URL="${{ steps.build_id.outputs.IMAGE_URL }}"
          INSTANCE_CONN="${{ vars.PROJECT_ID }}:${{ vars.REGION }}:lyra-db-instance"

          gcloud run deploy "${{ vars.SERVICE_NAME }}" \
            --image "$IMAGE_URL" \
            --region "${{ vars.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "$INSTANCE_CONN" \
            --vpc-connector "projects/${{ vars.PROJECT_ID }}/locations/${{ vars.REGION }}/connectors/lyra-suite-stage-conn" \
            --vpc-egress "private-ranges-only" \
            --set-env-vars ^|^ \
            LYRA_API_URL="${{ vars.LYRA_API_URL }}"|\
            HTTP_TIMEOUT_MS="${{ vars.HTTP_TIMEOUT_MS }}"|\
            HTTP_RETRIES="${{ vars.HTTP_RETRIES }}"|\
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}"|\
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"|\
            DATABASE_URL="postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@/${{ secrets.DB_NAME }}?host=/cloudsql/$INSTANCE_CONN&sslmode=disable"

      - name: Get Service URL
        run: |
          gcloud run services describe "${{ vars.SERVICE_NAME }}" \
            --region "${{ vars.REGION }}" \
            --format='value(status.url)'
