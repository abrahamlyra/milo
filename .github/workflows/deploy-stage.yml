name: Deploy Stage
on:
  push:
    branches: [ "stage" ]
jobs:
  # 1. build-code: Se encarga de npm ci/build
  build-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Build Code
        run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-app-artifact
          path: .
          retention-days: 1

  # 2. deploy: Se encarga de la autenticación, Docker y Cloud Run
  deploy:
    needs: build-code 
    # 💥 CORRECCIÓN FINAL: Esto obliga a GitHub a liberar los secrets de OIDC 💥
    environment: stage 
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-app-artifact
          path: .
          
      # El paso de autenticación ahora debe funcionar porque se ha declarado el 'environment: stage'
      - name: Auth to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          
      - name: Set GCP Project & Region Config
        run: |
          gcloud config set project ${{ vars.PROJECT_ID }}
          gcloud config set run/region ${{ vars.REGION }}

      - name: Build & Push Docker Image to Artifact Registry
        run: |
          IMAGE_URL=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.SERVICE_NAME }}-repo/${{ vars.SERVICE_NAME }}:${{ github.sha }}
          
          gcloud builds submit . \
            --tag "$IMAGE_URL"
            
      - name: Deploy to Cloud Run
        run: |
          IMAGE_URL=${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.SERVICE_NAME }}-repo/${{ vars.SERVICE_NAME }}:${{ github.sha }}
          
          gcloud run deploy ${{ vars.SERVICE_NAME }} \
            --image "$IMAGE_URL" \
            --region ${{ vars.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "LYRA_API_URL=${{ vars.LYRA_API_URL }},HTTP_TIMEOUT_MS=${{ vars.HTTP_TIMEOUT_MS }},HTTP_RETRIES=${{ vars.HTTP_RETRIES }},ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
            
      - name: Get Service URL
        run: gcloud run services describe ${{ vars.SERVICE_NAME }} --region ${{ vars.REGION }} --format='value(status.url)'