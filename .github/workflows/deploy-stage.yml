name: Deploy Stage
on:
  push:
    branches: [ "stage" ]

jobs:
  build-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-app-artifact
          path: .
          retention-days: 1

  deploy:
    needs: build-code
    environment: stage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-app-artifact
          path: .

      - name: Auth to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          access_token_lifetime: 1800s

      - name: Set GCP Project & Region
        shell: bash
        run: |
          gcloud config set project "${{ vars.PROJECT_ID }}"
          gcloud config set run/region "${{ vars.REGION }}"

      - name: Build & Push Docker Image (async)
        id: build_id
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.SERVICE_NAME }}-repo/${{ vars.SERVICE_NAME }}:${{ github.sha }}"
          BUILD_NAME="$(gcloud builds submit . --tag "$IMAGE_URL" --async --format='value(name)')"
          echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          for i in {1..120}; do
            STATUS="$(gcloud builds describe "$BUILD_NAME" --format='value(status)')"
            echo "STATUS: $STATUS"
            if [[ "$STATUS" == "SUCCESS" ]]; then exit 0; fi
            if [[ "$STATUS" == "FAILURE" || "$STATUS" == "CANCELLED" || "$STATUS" == "TIMEOUT" ]]; then exit 1; fi
            sleep 5
          done
          echo "Timeout esperando Cloud Build"; exit 1

      - name: Deploy to Cloud Run (env-file, sin VPC connector)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL="${{ steps.build_id.outputs.IMAGE_URL }}"
          INSTANCE_CONN="${{ vars.PROJECT_ID }}:${{ vars.REGION }}:lyra-db-instance"
          RUNTIME_SA="github-actions@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com"

          # Generar archivo de entorno sin heredoc (evita errores de YAML)
          printf "%s\n" \
            "LYRA_API_URL=${{ vars.LYRA_API_URL }}" \
            "HTTP_TIMEOUT_MS=${{ vars.HTTP_TIMEOUT_MS }}" \
            "HTTP_RETRIES=${{ vars.HTTP_RETRIES }}" \
            "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@/${{ secrets.DB_NAME }}?host=/cloudsql/${INSTANCE_CONN}&sslmode=disable" \
            > /tmp/milo.env

          gcloud run deploy "${{ vars.SERVICE_NAME }}" \
            --image "$IMAGE_URL" \
            --region "${{ vars.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --add-cloudsql-instances "$INSTANCE_CONN" \
            --env-vars-file /tmp/milo.env \
            --cpu 1 --memory 512Mi --timeout 300

      - name: Get Service URL
        shell: bash
        run: |
          gcloud run services describe "${{ vars.SERVICE_NAME }}" \
            --region "${{ vars.REGION }}" \
            --format='value(status.url)'
